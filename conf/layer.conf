# Add this layer to BBPATH
BBPATH .= ":${LAYERDIR}"

# Include all recipes and append files
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/*/*.bb \
            ${LAYERDIR}/*/*.bbappend"

# Define collection name (must be unique)
BBFILE_COLLECTIONS += "rdkbluetooth"

# Match all files under this layer
BBFILE_PATTERN_rdkbluetooth = "^${LAYERDIR}/"

# Priority (higher wins in conflicts)
BBFILE_PRIORITY_rdkbluetooth = "6"

# Dependencies (adjust if needed)
LAYERDEPENDS_rdkbluetooth = "core"

# Compatible Yocto releases
LAYERSERIES_COMPAT_rdkbluetooth = "dunfell kirkstone"
